highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
environment: prod
url: "https://lukakirigin.com"
baseurl: ""  # The custom domain serves the site at its root.
plugins:
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-feed

scholar:
  source: ./_bibliography
  bibliography: references.bib

# Development files should not be published as static pages.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Gemfile.lock.old
  - vendor

markdown: kramdown

kramdown:
  input: GFM
  math_engine: mathjax
